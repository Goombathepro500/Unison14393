
name: Build Unison ARM (diagnostic)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Diagnose UWP references
        shell: pwsh
        run: |
          Write-Host "=== MSBuild ==="
          msbuild -version

          Write-Host "=== Windows SDK folders ==="
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib" |
            Select-Object -ExpandProperty Name

          Write-Host "=== Windows.winmd files ==="
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Filter Windows.winmd -Recurse -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

          Write-Host "=== UWP project references ==="
          Get-ChildItem -Recurse -Filter Unison.Background.csproj |
            Select-Object -ExpandProperty FullName

      - name: Lower minimum OS version to 14393
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter Package.appxmanifest | ForEach-Object {
            (Get-Content $_.FullName -Raw) `
              -replace 'MinVersion="[^"]+"', 'MinVersion="10.0.14393.0"' |
              Set-Content $_.FullName -NoNewline
          }

          Get-ChildItem -Recurse -Filter *.csproj | ForEach-Object {
            (Get-Content $_.FullName -Raw) `
              -replace '<TargetPlatformMinVersion>[^<]+</TargetPlatformMinVersion>', '<TargetPlatformMinVersion>10.0.14393.0</TargetPlatformMinVersion>' |
              Set-Content $_.FullName -NoNewline
          }

      - name: Build ARM Release
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter Unison.Uwp.csproj |
            Select-Object -First 1

          if (-not $proj) {
            throw "Unison.Uwp.csproj not found"
          }

          msbuild $proj.FullName /restore `
            /p:Configuration=Release `
            /p:Platform=ARM `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\out\"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unison-arm-diagnostic
          path: out/**
          if-no-files-found: ignore
